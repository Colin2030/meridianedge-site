<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smiths of Sussex - Handmade products from Sussex for all your corporate or personal needs.">
    <title>Smiths of Sussex | Handmade Products from Sussex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 50px;
        }

        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: brightness(0) invert(1);
        }

        .headline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 400;
            font-style: italic;
            color: #e8d5b7;
            max-width: 600px;
            line-height: 1.5;
            margin-bottom: 60px;
            letter-spacing: 0.02em;
        }

        .headline span {
            text-transform: capitalize;
        }

        .contact-section {
            margin-bottom: 40px;
        }

        .contact-label {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
        }

        .email-link {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #f5f5f5;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
            padding-bottom: 3px;
        }

        .email-link:hover {
            color: #e8d5b7;
            border-bottom-color: #e8d5b7;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #666, transparent);
            margin: 40px auto;
        }

        .tagline {
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #666;
        }

        footer {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px 20px;
            text-align: center;
        }

        .footer-text {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            letter-spacing: 0.02em;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .logo {
                max-width: 200px;
            }

            .headline {
                font-size: 1.6rem;
                margin-bottom: 40px;
            }

            .email-link {
                font-size: 1.2rem;
            }
        }

        /* Subtle animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-wrapper {
            animation: fadeIn 1s ease-out;
        }

        .headline {
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .contact-section {
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .divider, .tagline {
            animation: fadeIn 1s ease-out 0.6s both;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo-wrapper">
            <img src="images/SoS Logo Round Icon.png" alt="Smiths of Sussex" class="logo">
        </div>

        <h1 class="headline">
            Handmade products from <span>Sussex</span>.<br>
            For all your corporate or personal needs.
        </h1>

        <div class="contact-section">
            <p class="contact-label">Get in touch</p>
            <a href="mailto:hello@smithsofsussex.co.uk" class="email-link">hello@smithsofsussex.co.uk</a>
        </div>

        <div class="divider"></div>

        <p class="tagline">Local • Ethical • Handcrafted</p>
    </main>

    <footer>
        <p class="footer-text">
            Smiths of Sussex is a trading name of Meridian Edge Ltd.<br>
            Company Number: 16554239 | VAT Number: GB 500603648
        </p>
    </footer>
</body>
</html>
